# Builds the CMU Database Android app (APK) on GitHub.
#  • Every push to main (or "Run workflow" on the Actions tab) builds a test APK.
#    Download it: Actions tab ▸ the latest run ▸ Artifacts ▸ "CMU-Database-APK" (a zip with the .apk inside).
#  • Pushing a tag such as v2.0.1 also publishes a GitHub Release with the APK attached (easy phone download link).
name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 2.0.${{ github.run_number }}
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Works whether the files were uploaded at the top of the repository or inside one folder
      - name: Find the project folder
        run: |
          PKG=$(find . -name package.json -not -path "*/node_modules/*" -not -path "./.git/*" | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$PKG" ]; then
            echo "::error::package.json not found. Upload ALL the files from the unzipped cmu-database-android folder (including the hidden .github folder)."
            find . -maxdepth 3 -not -path "./.git*" | head -60
            exit 1
          fi
          PROJ=$(dirname "$PKG")
          for f in src/main.jsx index.html vite.config.js capacitor.config.json scripts/prepare-android.mjs android-res keys/cmu-test.keystore; do
            [ -e "$PROJ/$f" ] || { echo "::error::Missing $f – upload it to the same place as package.json"; exit 1; }
          done
          echo "Project folder: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      # GitHub's Ubuntu machines include the Android SDK; add the exact platform this app compiles against
      - name: Prepare the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "Using $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install and build the app
        run: |
          cd "$PROJ"
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run build
          node scripts/prepare-android.mjs
          npx cap sync android

      # Optional permanent release key (see README "Release key"); without it a test-signed APK is built
      - name: Restore the release key (if set up)
        env:
          KS_B64: ${{ secrets.CMU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/cmu-release.jks"
            echo "CMU_KEYSTORE_PATH=$RUNNER_TEMP/cmu-release.jks" >> "$GITHUB_ENV"
          else
            echo "No release key in the repository secrets – building a test-signed APK."
          fi

      - name: Build the APK
        env:
          CMU_KEYSTORE_PASSWORD: ${{ secrets.CMU_KEYSTORE_PASSWORD }}
          CMU_KEY_ALIAS: ${{ secrets.CMU_KEY_ALIAS }}
          CMU_KEY_PASSWORD: ${{ secrets.CMU_KEY_PASSWORD }}
        run: |
          cd "$PROJ/android"
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -n "$CMU_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/CMU-Database-$VERSION_NAME.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/CMU-Database-$VERSION_NAME.aab"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/CMU-Database-$VERSION_NAME.apk"
          fi
          cp "$GITHUB_WORKSPACE/$PROJ/apps-script/MobileAPI.gs" "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: CMU-Database-APK
          path: out/
          retention-days: 30

      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.apk out/MobileAPI.gs --title "CMU Database $GITHUB_REF_NAME" \
            --notes "Android app for the CMU DATABASE Google Sheet. Install the .apk on the phone; update MobileAPI.gs in the sheet's Apps Script if it changed." || \
          gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
